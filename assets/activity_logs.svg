<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 550 45'
    style='background-color: #00000000;'
    width='550px' height='45px'>

    <style>
@font-face {
  font-family: 'Shantell Sans';
  font-style: normal;
  font-weight: 400;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d0.end'
                    dur='6000ms' fill='remove'
                    values='m0,22.5 h0 ; m0,22.5 h550 ; m0,22.5 h550 ; m0,22.5 h0' keyTimes='0;0.66666666666667;0.83333333333333;1' />
                    </path>
    <text font-family='"Shantell Sans", monospace' fill='#f75c7e' font-size='22'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            📡 Activity Logs 📡
        </textPath>
    </text>
</svg>
